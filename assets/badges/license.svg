<svg xmlns="http://www.w3.org/2000/svg" width="84" height="20" viewBox="0 0 84 20" role="img" aria-label="license: MIT">
  <title>license: MIT</title>
  <defs>
    <clipPath id="r-lic">
      <rect width="84" height="20" rx="3" fill="#fff"/>
    </clipPath>
    <linearGradient id="depth-lic" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="sg-lic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes shimmerLIC { 0% { transform: translateX(0); } 100% { transform: translateX(168px); } }
      .sLIC { animation: shimmerLIC 3s linear infinite; animation-delay: 2.4s; }
    </style>
  </defs>
  <g clip-path="url(#r-lic)">
    <rect width="54"  height="20" fill="#555"/>
    <rect x="54" width="30" height="20" fill="#97ca00"/>
    <rect width="84"  height="20" fill="url(#depth-lic)"/>
    <rect class="sLIC" x="-84" width="84" height="20" fill="url(#sg-lic)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
    <text x="27"  y="15" fill="#010101" fill-opacity=".25">license</text>
    <text x="27"  y="14">license</text>
    <text x="69"  y="15" fill="#010101" fill-opacity=".25">MIT</text>
    <text x="69"  y="14">MIT</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="108" height="20" viewBox="0 0 108 20" role="img" aria-label="runtime: .NET 10">
  <title>runtime: .NET 10</title>
  <defs>
    <clipPath id="r-dn">
      <rect width="108" height="20" rx="3" fill="#fff"/>
    </clipPath>
    <linearGradient id="depth-dn" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="sg-dn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes shimmerDN { 0% { transform: translateX(0); } 100% { transform: translateX(216px); } }
      .sDN { animation: shimmerDN 3s linear infinite; }
    </style>
  </defs>
  <g clip-path="url(#r-dn)">
    <rect width="54"  height="20" fill="#555"/>
    <rect x="54" width="54" height="20" fill="#512bd4"/>
    <rect width="108" height="20" fill="url(#depth-dn)"/>
    <rect class="sDN" x="-108" width="108" height="20" fill="url(#sg-dn)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
    <text x="27"  y="15" fill="#010101" fill-opacity=".25">runtime</text>
    <text x="27"  y="14">runtime</text>
    <text x="81"  y="15" fill="#010101" fill-opacity=".25">.NET 10</text>
    <text x="81"  y="14">.NET 10</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="108" height="20" viewBox="0 0 108 20" role="img" aria-label="analysis: Roslyn">
  <title>analysis: Roslyn</title>
  <defs>
    <clipPath id="r-rs">
      <rect width="108" height="20" rx="3" fill="#fff"/>
    </clipPath>
    <linearGradient id="depth-rs" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="sg-rs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes shimmerRS { 0% { transform: translateX(0); } 100% { transform: translateX(216px); } }
      .sRS { animation: shimmerRS 3s linear infinite; animation-delay: 1.8s; }
    </style>
  </defs>
  <g clip-path="url(#r-rs)">
    <rect width="60"  height="20" fill="#555"/>
    <rect x="60" width="48" height="20" fill="#0078d7"/>
    <rect width="108" height="20" fill="url(#depth-rs)"/>
    <rect class="sRS" x="-108" width="108" height="20" fill="url(#sg-rs)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
    <text x="30"  y="15" fill="#010101" fill-opacity=".25">analysis</text>
    <text x="30"  y="14">analysis</text>
    <text x="84"  y="15" fill="#010101" fill-opacity=".25">Roslyn</text>
    <text x="84"  y="14">Roslyn</text>
  </g>
</svg>
